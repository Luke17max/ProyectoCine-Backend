server:
  port: 8086

spring:
  application:
    name: ms-confiteria
  datasource:
    url: jdbc:mysql://localhost:3306/db_confiteria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true